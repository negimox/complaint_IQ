[tool.poetry]
name = "complaint-iq-backend"
version = "0.1.0"
description = "AI-Powered Customer Complaint Management System backend"
authors = ["ComplaintIQ"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.2"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.1"

# LangGraph + LLM
langgraph = "^0.2.28"
langchain-core = "^0.3.0"
langchain-groq = "^0.2.0"
groq = "^0.11.0"

# Document parsing
pdfplumber = "^0.11.4"
python-docx = "^1.1.2"
pytesseract = "^0.3.13"
Pillow = "^10.4.0"

# Embeddings (for duplicate detection bonus)
sentence-transformers = "^3.1.0"

# Utilities
httpx = "^0.27.0"
sse-starlette = "^2.1.3"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
